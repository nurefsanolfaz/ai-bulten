[project]
name = "ai-bulten"
version = "0.1.0"
description = "Kişiselleştirilmiş günlük AI bülteni: topla → filtrele → LLM ile puanla → Türkçe yaz → Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    "anthropic>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
