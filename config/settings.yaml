# ---------------------------------------------------------------------------
# Genel ayarlar
# ---------------------------------------------------------------------------
timezone_offset_hours: 3        # Türkiye (UTC+3) — bülten tarihi için
quiet_hours: [0, 7]             # TR saatiyle bu aralıkta gelen bülten sessiz bildirimle gönderilir
lookback_hours: 48              # tarihi olan öğelerde en fazla bu kadar geriye bak
seen_retention_days: 90         # bu kadar gündür hiçbir kaynakta görülmeyen kayıtlar silinir
archive: false                  # true → her bülten archive/YYYY-MM-DD.md olarak repoya da yazılır
                                #        (public repoda herkes görür; sosyal medya paylaşımı için faydalı)

# ---------------------------------------------------------------------------
# Bülten bölümleri — BURADAKİLER GENEL ÖRNEKTİR.
# Gerçek, kişiye özel bölümler gizli profilde (config/profile.yaml / PROFILE_YAML secret'ı) tanımlanır
# ve bu listenin yerine geçer. Bkz. config/profile.example.yaml
#
#   description → hem embedding ön filtresinde hem LLM promptlarında kullanılır
#   keywords    → ön filtrede ek puan (küçük harf, kelime/kalıp)
#   count       → bültende bu bölüme girecek haber sayısı
#   popularity_weight → HF upvote / HN puanı / GitHub yıldızının bu bölümdeki etkisi (log ölçekli)
# ---------------------------------------------------------------------------
sections:
  - id: work
    title: "Senin Alanın"
    emoji: "💼"
    count: 4
    popularity_weight: 0.04
    description: >-
      Applied LLM engineering: retrieval-augmented generation, fine-tuning, evaluation, prompt engineering,
      LLM agents and tool use, inference optimization, MLOps and deploying models in production.
    keywords: [rag, retrieval, fine-tuning, evaluation, eval, prompt, agent, tool use, inference,
               quantization, deployment, mlops, serving, vector database]

  - id: ai
    title: "AI'da Önemli Gelişmeler"
    emoji: "🚀"
    count: 5
    popularity_weight: 0.12       # bu bölümde "önem" büyük ölçüde topluluk ilgisinden okunur
    description: >-
      Major developments in artificial intelligence: new frontier model releases, large language models,
      open-weight models, breakthrough research results, benchmarks, AI agents, important tools and
      libraries, AI policy and industry news with broad impact.
    keywords: [llm, large language model, gpt, claude, gemini, llama, qwen, mistral, deepseek,
               open-weight, open source model, benchmark, agent, reasoning, multimodal, release,
               frontier, state-of-the-art, fine-tuning, rlhf, alignment]

  - id: applied
    title: "Sektörde AI"
    emoji: "🌍"
    count: 3
    popularity_weight: 0.04
    description: >-
      Real-world adoption of AI across industries: case studies, deployments in healthcare, finance,
      education, retail and the public sector, business impact and lessons learned.
    keywords: [case study, deployment, adoption, enterprise, healthcare, finance, education, retail,
               productivity, roi]

# ---------------------------------------------------------------------------
# Ön filtre
# ---------------------------------------------------------------------------
prefilter:
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  per_section: 25               # her bölüm için en iyi N aday LLM'e gider (birleşimi alınır)
  max_candidates: 70            # LLM'e gidecek toplam üst sınır
  keyword_weight: 0.06          # eşleşen her anahtar kelime için (en fazla 3 kelime sayılır)
  # Aynı haberin farklı başlıklı kopyalarını birleştir (başlık embedding benzerliği + sürüm/kaynak kuralları).
  # 0.86, gerçek veride ölçülerek seçildi: altında farklı haberler karışmaya başlıyor.
  semantic_dedup:
    threshold: 0.86
    history_days: 7             # son 7 günde gönderilen haberlerin farklı başlıklı tekrarı da atlanır
  # Genel kaynaklarda (HN, GitHub Trending, Reddit…) AI ile ilgisi olmayanları elemek için
  ai_keywords: [ai, a.i., llm, gpt, model, neural, machine learning, ml, deep learning, transformer,
                agent, openai, anthropic, claude, gemini, llama, mistral, deepseek, qwen, hugging face,
                diffusion, embedding, rag, inference, fine-tuning, fine-tuned, dataset,
                benchmark, chatbot, copilot, nvidia, gpu, reasoning, multimodal, vision, robot]

# ---------------------------------------------------------------------------
# LLM sağlayıcıları
#   type: openai  → OpenAI uyumlu /chat/completions (Groq, Gemini, OpenRouter)
#   type: anthropic → Claude, resmi Anthropic SDK'sı (Messages API)
# Anahtarı tanımlı olmayan sağlayıcı zincirde otomatik atlanır.
# ---------------------------------------------------------------------------
providers:
  groq:
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
  gemini:
    type: openai
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: GEMINI_API_KEY
  openrouter:
    type: openai
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

# ---------------------------------------------------------------------------
# LLM profilleri — her profil puanlama (score) ve yazım (write) için bir model zinciri tanımlar.
# Zincirdeki modeller sırayla denenir (hata / kota → sonrakine geç).
# Aktif profil: `profile` alanı, ya da LLM_PROFILE ortam değişkeni (Actions'ta workflow girdisi).
# Karşılaştırma için: python -m bulten.compare  (her profilin sadece İLK modellerini kullanır)
#
# Claude adımlarında:
#   effort:    low | medium | high | xhigh | max   (Haiku 4.5 desteklemez, verme)
#   fallbacks: default → Claude Opus 5 bir isteği güvenlik sınıflandırıcısı yüzünden reddederse
#              Anthropic sunucu tarafında uygun modele yönlendirir
# ---------------------------------------------------------------------------
llm:
  profile: free
  score_batch_size: 10
  profiles:
    free:
      score:
        - {provider: groq, model: "openai/gpt-oss-120b", reasoning_effort: low}
        - {provider: gemini, model: "gemini-3.1-flash-lite"}
        - {provider: openrouter, model: "openai/gpt-oss-120b:free"}
      write:
        - {provider: gemini, model: "gemini-3.5-flash"}
        - {provider: gemini, model: "gemini-3.1-flash-lite"}
        - {provider: groq, model: "openai/gpt-oss-120b", reasoning_effort: medium}
        - {provider: openrouter, model: "openai/gpt-oss-120b:free"}

    claude:                     # puanlama Haiku (ucuz, hızlı), yazım Opus 5 (en iyi Türkçe)
      score:
        - {provider: anthropic, model: "claude-haiku-4-5"}
        - {provider: groq, model: "openai/gpt-oss-120b", reasoning_effort: low}
      write:
        - {provider: anthropic, model: "claude-opus-5", effort: medium, fallbacks: default}
        - {provider: gemini, model: "gemini-3.5-flash"}

    claude_sonnet:              # daha ucuz Claude seçeneği: yazım Sonnet 5
      score:
        - {provider: anthropic, model: "claude-haiku-4-5"}
        - {provider: groq, model: "openai/gpt-oss-120b", reasoning_effort: low}
      write:
        - {provider: anthropic, model: "claude-sonnet-5", effort: medium}
        - {provider: gemini, model: "gemini-3.5-flash"}

    hybrid:                     # ücretsiz puanlama + Claude Sonnet ile yazım (düşük maliyetli orta yol)
      score:
        - {provider: groq, model: "openai/gpt-oss-120b", reasoning_effort: low}
        - {provider: gemini, model: "gemini-3.1-flash-lite"}
      write:
        - {provider: anthropic, model: "claude-sonnet-5", effort: medium}
        - {provider: gemini, model: "gemini-3.5-flash"}

# Tahmini maliyet hesabı için ($ / 1M token: [girdi, çıktı]). Listede olmayan model = ücretsiz kota.
pricing:
  claude-haiku-4-5: [1.00, 5.00]
  claude-sonnet-5: [2.00, 10.00]
  claude-opus-5: [5.00, 25.00]

scoring:
  min_score: 6                  # bu puanın altındaki haberler bültene girmez

# ---------------------------------------------------------------------------
# Flaş haber — saatlik kontrol, gerçekten büyük bir gelişmede günlük bülteni beklemeden anında bildirim.
# Sadece hızlı ve önemli kaynaklara bakar; LLM çok katı bir eşikle (9/10) karar verir.
# Flaşta gönderilen haber o günün bülteninde tekrar yer almaz.
# ---------------------------------------------------------------------------
flash:
  # Kişisel kaynaklar profilde eklenebilir (profilde flash.sources tam liste olarak yazılır)
  sources: [OpenAI, Google DeepMind, Anthropic, Meta AI, Mistral AI, Hugging Face Blog,
            Hacker News, HF Daily Papers]
  lookback_hours: 24
  min_popularity:               # bu kaynaklarda sadece topluluğun gerçekten ilgilendiği öğelere bakılır
    Hacker News: 250
    HF Daily Papers: 100
  min_score: 9                  # 10 üzerinden; düşürürsen daha çok (ve daha az önemli) flaş gelir
  max_per_day: 3                # gün içinde en fazla bu kadar flaş
